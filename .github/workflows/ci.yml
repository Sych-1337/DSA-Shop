name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kawaiko
          POSTGRES_PASSWORD: kawaiko
          POSTGRES_DB: kawaiko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kawaiko -d kawaiko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kawaiko:kawaiko@localhost:5432/kawaiko?schema=public
      DIRECT_URL: postgresql://kawaiko:kawaiko@localhost:5432/kawaiko?schema=public
      BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      ADMIN_AUTH_BYPASS: "true"
      CRON_SECRET: ci-cron-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma db push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NODE_ENV: production
          ADMIN_AUTH_BYPASS: "true"
