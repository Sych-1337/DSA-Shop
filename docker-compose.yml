services:
  postgres:
    image: postgres:16-alpine
    container_name: kawaiko-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kawaiko
      POSTGRES_PASSWORD: kawaiko
      POSTGRES_DB: kawaiko
    volumes:
      - kawaiko_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawaiko -d kawaiko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kawaiko_pg_data:
